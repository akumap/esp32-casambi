# ESP32 Casambi Controller - PlatformIO Configuration

# =============================================================================
# COMMON CONFIGURATION
# =============================================================================
[common]
extra_scripts = pre:scripts/build_number.py
lib_deps =
    bblanchon/ArduinoJson @ 7.0.0
    # Maintained ESP32Async async stack (replaces the unmaintained esphome/*
    # forks). Pinned to fixed tags for reproducible builds. The close/FIN path
    # fixes here (AsyncTCP v3.4.x) target the connection-churn crashes in #18.
    # AsyncTCP is listed BEFORE ESPAsyncWebServer so the LDF resolves the web
    # server's AsyncTCP dependency to this exact version, not a registry default.
    https://github.com/ESP32Async/AsyncTCP#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer#v3.11.1
    h2zero/NimBLE-Arduino @ 2.1.0

# Common build flags for all environments
build_flags =
    -DCORE_DEBUG_LEVEL=0
    # Compile NimBLE's return-code → text table. Without it every BLE error is
    # a bare number in the log (NimBLEUtils::returnCodeToString returns ""),
    # which is what made the connect failures in #42 undiagnosable. Costs a few
    # KB of flash in the huge_app partition.
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
    # AsyncTCP task placement / watchdog. Same macro names in the ESP32Async
    # fork; remaining knobs (stack size, queue size, priority) keep the new
    # lib's defaults. Re-tune only if the #18 stress reproduction needs it.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0

# Upload settings
upload_speed = 115200
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize

# =============================================================================
# ESP32 DevKit V4 (Primary target)
# =============================================================================
[env:devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino

# Build-number injection. NOTE: [common] is not a special section — options
# there only apply where a ${common.…} reference pulls them in, so this line
# must exist per environment (debug/release inherit it via `extends`).
# Without it the pre-script never runs and FIRMWARE_BUILD stays 0.
extra_scripts = ${common.extra_scripts}

# Storage and partitions
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

# Libraries
lib_deps = ${common.lib_deps}

# Build configuration
build_flags =
    ${common.build_flags}
#    -DBOARD_HAS_PSRAM
#    -mfix-esp32-psram-cache-issue

# Upload/Monitor
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

# =============================================================================
# ESP32-C3 DevKit M1 (Alternative board)
#
# Build-only target: kept compiling here and in CI so C3 support does not rot,
# but currently UNTESTED on hardware (no C3 board available — hence not listed
# under "Tested Hardware" in the README).
# =============================================================================
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

# Build-number injection (see the devkit-v4 note).
extra_scripts = ${common.extra_scripts}

# Storage and partitions
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

# Libraries
lib_deps = ${common.lib_deps}

# Build configuration (C3 specific)
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

# Upload/Monitor
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

# =============================================================================
# NATIVE HOST TESTS (no hardware)
#
# Fast host-side unit tests for pure logic that must not regress silently:
# config validation (hex-key + required fields, S-01) and the preserve-local
# helper (S-04). Run with `pio test -e native`. Only the pure headers under test
# are compiled — no Arduino/BLE/LittleFS dependencies — plus a tiny Arduino
# `String`/`JsonVariant` shim is not needed because config_validation.h uses only
# ArduinoJson and const char*.
# =============================================================================
[env:native]
platform = native
test_framework = unity
# Latest 7.x for the HOST test build. The validation API (is<>/as<>/operator[])
# is identical to the 7.0.0 the firmware pins; a newer patch is used here only
# because ArduinoJson 7.0.0 does not compile on modern host GCC (the ESP32
# xtensa toolchain, an older GCC, builds 7.0.0 fine).
lib_deps =
    bblanchon/ArduinoJson @ ^7.2
build_flags =
    -std=gnu++17
    -I src

# =============================================================================
# DEBUG BUILD (Enable verbose logging)
# =============================================================================
[env:debug]
extends = env:devkit-v4
build_type = debug
build_flags =
    ${env:devkit-v4.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_HTTP_SERVER
    -DDEBUG_ESP_WIFI
    -O0
    -ggdb

monitor_filters =
    esp32_exception_decoder
    log2file
    colorize
    time

# =============================================================================
# RELEASE BUILD (Optimized for size and speed)
# =============================================================================
[env:release]
extends = env:devkit-v4
build_type = release
build_flags =
    ${env:devkit-v4.build_flags}
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DNDEBUG
